<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>criterio.design</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app" class="app" data-view="loading">
    <header class="top">
      <img class="logo" src="icons/icon48.png" alt="" width="22" height="22" draggable="false" />
      <span class="brand">criterio.design</span>
      <label class="chip" id="ws-chip" hidden>
        <select id="ws-select" aria-label="Workspace"></select>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
      </label>
    </header>

    <!-- No key: connect -->
    <section class="view" data-view="connect">
      <div class="card">
        <h1 class="title" data-i18n="lead">Save the site you're looking at to your library.</h1>
        <p class="hint" id="connect-msg"></p>
        <button class="btn btn--primary btn--block" id="btn-connect" data-i18n="connect">Connect to criterio.design</button>
      </div>
      <details class="paste">
        <summary data-i18n="haveKey">I already have a key</summary>
        <div class="paste__body">
          <input class="input" id="paste-key" placeholder="crit_…" spellcheck="false" autocomplete="off" />
          <input class="input" id="paste-base" placeholder="https://criterio.design" spellcheck="false" autocomplete="off" />
          <button class="btn btn--block" id="btn-paste" data-i18n="useKey">Use this key</button>
        </div>
      </details>
    </section>

    <!-- With key: what is about to be saved (the tab, or the image or video right-clicked in it),
         shown as it will look in the library, then the board's add form: note, project, areas -->
    <section class="view" data-view="tab">
      <div class="card">
        <div class="shot" id="shot" hidden><img id="shot-img" alt="" hidden /></div>
        <div class="site">
          <span class="site__icon">
            <img id="tab-fav" alt="" hidden />
            <svg id="tab-fav-fallback" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c1.8 1.9 2.7 4 2.7 6.25S9.8 12.4 8 14.25M8 1.75C6.2 3.65 5.3 5.75 5.3 8s.9 4.4 2.7 6.25"/></svg>
          </span>
          <div class="site__text">
            <div class="site__title" id="tab-title"></div>
            <div class="site__host" id="tab-host"></div>
          </div>
        </div>
        <div class="form" id="form">
          <textarea class="input input--note" id="tab-note" rows="2" maxlength="500" data-i18n-placeholder="noteHint" spellcheck="true"></textarea>
          <div class="dest" id="dest" hidden>
            <label class="select">
              <span class="select__label" data-i18n="projectLabel">Project</span>
              <select id="project-select"></select>
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
            </label>
            <div class="pills" id="areas" role="group" data-i18n-label="areasLabel"></div>
          </div>
        </div>
        <p class="hint" id="tab-msg"></p>
        <div class="actions">
          <button class="btn btn--primary btn--block" id="btn-save"><span class="btn__check" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4l2.6 2.6L11 4.4"/></svg></span><span id="btn-save-label" data-i18n="save">Save</span></button>
          <a class="btn btn--block" id="btn-open" target="_blank" rel="noopener" hidden data-i18n="viewOn">View on criterio.design</a>
        </div>
        <!-- Only with the tab: how to save one image or video, and bringing in what is saved elsewhere -->
        <div class="extras" id="extras">
          <p class="hint" data-i18n="rightClickHint">Right-click any image or video to save only that.</p>
          <div class="import-row">
            <span class="import-row__label" data-i18n="importLabel">Import</span>
            <button class="btn btn--small" id="btn-import-x">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              <span data-i18n="importXShort">Bookmarks on X</span>
            </button>
            <button class="btn btn--small" id="btn-import-pinterest">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 01.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>
              <span data-i18n="importPinterestShort">Pinterest board</span>
            </button>
            <button class="btn btn--small" id="btn-import-browser" data-i18n="importBrowserShort">Chrome bookmarks</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot" id="foot" hidden>
      <span class="foot__who" id="who"></span>
      <button class="link" id="btn-disconnect" data-i18n="disconnect">Disconnect</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
