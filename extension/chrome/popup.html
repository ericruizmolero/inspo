<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>criterio.design</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app" class="app" data-view="loading">
    <header class="top">
      <img class="logo" src="icons/icon48.png" alt="" width="22" height="22" draggable="false" />
      <span class="brand">criterio.design</span>
      <label class="chip" id="ws-chip" hidden>
        <select id="ws-select" aria-label="Workspace"></select>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
      </label>
    </header>

    <!-- No key: connect -->
    <section class="view" data-view="connect">
      <div class="card">
        <h1 class="title" data-i18n="lead">Save the site you're looking at to your library.</h1>
        <p class="hint" id="connect-msg"></p>
        <button class="btn btn--primary btn--block" id="btn-connect" data-i18n="connect">Connect to criterio.design</button>
      </div>
      <details class="paste">
        <summary data-i18n="haveKey">I already have a key</summary>
        <div class="paste__body">
          <input class="input" id="paste-key" placeholder="crit_…" spellcheck="false" autocomplete="off" />
          <input class="input" id="paste-base" placeholder="https://criterio.design" spellcheck="false" autocomplete="off" />
          <button class="btn btn--block" id="btn-paste" data-i18n="useKey">Use this key</button>
        </div>
      </details>
    </section>

    <!-- With key: the current tab, shown as it will look in the library -->
    <section class="view" data-view="tab">
      <div class="card">
        <div class="shot" id="shot" hidden><img id="shot-img" alt="" hidden /></div>
        <div class="site">
          <span class="site__icon">
            <img id="tab-fav" alt="" hidden />
            <svg id="tab-fav-fallback" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c1.8 1.9 2.7 4 2.7 6.25S9.8 12.4 8 14.25M8 1.75C6.2 3.65 5.3 5.75 5.3 8s.9 4.4 2.7 6.25"/></svg>
          </span>
          <div class="site__text">
            <div class="site__title" id="tab-title"></div>
            <div class="site__host" id="tab-host"></div>
          </div>
        </div>
        <textarea class="input input--note" id="tab-note" rows="2" maxlength="500" data-i18n-placeholder="noteHint" spellcheck="true"></textarea>
        <p class="hint" id="tab-msg"></p>
        <div class="actions">
          <button class="btn btn--primary btn--block" id="btn-save" data-i18n="save">Save</button>
          <a class="btn btn--block" id="btn-open" target="_blank" rel="noopener" hidden data-i18n="viewOn">View on criterio.design</a>
        </div>
      </div>
    </section>

    <footer class="foot" id="foot" hidden>
      <span class="foot__who" id="who"></span>
      <button class="link" id="btn-disconnect" data-i18n="disconnect">Disconnect</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
