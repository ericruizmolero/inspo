<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>criterio.design</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app" class="app" data-view="loading">
    <header class="top">
      <img class="logo" src="icons/icon48.png" alt="" width="22" height="22" draggable="false" />
      <span class="brand">criterio.design</span>
      <label class="chip" id="ws-chip" hidden>
        <select id="ws-select" aria-label="Workspace"></select>
        <svg width="10" height="10" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
      </label>
    </header>

    <!-- No key: connect -->
    <section class="view" data-view="connect">
      <div class="card">
        <h1 class="title" data-i18n="lead">Save the site you're looking at to your library.</h1>
        <p class="hint" id="connect-msg"></p>
        <button class="btn btn--primary btn--block" id="btn-connect" data-i18n="connect">Connect to criterio.design</button>
      </div>
      <details class="paste">
        <summary data-i18n="haveKey">I already have a key</summary>
        <div class="paste__body">
          <input class="input" id="paste-key" placeholder="crit_…" spellcheck="false" autocomplete="off" />
          <input class="input" id="paste-base" placeholder="https://criterio.design" spellcheck="false" autocomplete="off" />
          <button class="btn btn--block" id="btn-paste" data-i18n="useKey">Use this key</button>
        </div>
      </details>
    </section>

    <!-- With key: what is about to be saved (the tab, or the image or video right-clicked in it),
         shown as it will look in the library, then the board's add form: note, project, areas -->
    <section class="view" data-view="tab">
      <div class="card">
        <div class="shot" id="shot" hidden><img id="shot-img" alt="" hidden /></div>
        <div class="site">
          <span class="site__icon">
            <img id="tab-fav" alt="" hidden />
            <svg id="tab-fav-fallback" width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24h0A104,104,0,1,0,232,128,104.12,104.12,0,0,0,128,24Zm88,104a87.61,87.61,0,0,1-3.33,24H174.16a157.44,157.44,0,0,0,0-48h38.51A87.61,87.61,0,0,1,216,128ZM102,168H154a115.11,115.11,0,0,1-26,45A115.27,115.27,0,0,1,102,168Zm-3.9-16a140.84,140.84,0,0,1,0-48h59.88a140.84,140.84,0,0,1,0,48ZM40,128a87.61,87.61,0,0,1,3.33-24H81.84a157.44,157.44,0,0,0,0,48H43.33A87.61,87.61,0,0,1,40,128ZM154,88H102a115.11,115.11,0,0,1,26-45A115.27,115.27,0,0,1,154,88Zm52.33,0H170.71a135.28,135.28,0,0,0-22.3-45.6A88.29,88.29,0,0,1,206.37,88ZM107.59,42.4A135.28,135.28,0,0,0,85.29,88H49.63A88.29,88.29,0,0,1,107.59,42.4ZM49.63,168H85.29a135.28,135.28,0,0,0,22.3,45.6A88.29,88.29,0,0,1,49.63,168Zm98.78,45.6a135.28,135.28,0,0,0,22.3-45.6h35.66A88.29,88.29,0,0,1,148.41,213.6Z"></path></svg>
          </span>
          <div class="site__text">
            <div class="site__title" id="tab-title"></div>
            <div class="site__host" id="tab-host"></div>
          </div>
        </div>
        <div class="form" id="form">
          <!-- Each field as the system's TextField: a small quiet label above its well -->
          <label class="field">
            <span class="field__label" data-i18n="noteLabel">Note</span>
            <textarea class="input input--note" id="tab-note" rows="2" maxlength="500" data-i18n-placeholder="noteHint" spellcheck="true"></textarea>
          </label>
          <div class="dest" id="dest" hidden>
            <label class="field">
              <span class="field__label" data-i18n="projectLabel">Project</span>
              <span class="select select--plain">
                <select id="project-select"></select>
                <svg width="10" height="10" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
              </span>
            </label>
            <div class="field">
              <span class="field__label" data-i18n="areasLabel">Areas of the system</span>
              <div class="pills" id="areas" role="group" data-i18n-label="areasLabel"></div>
            </div>
          </div>
        </div>
        <p class="hint" id="tab-msg"></p>
        <div class="actions">
          <button class="btn btn--primary btn--block" id="btn-save"><span class="btn__check" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"></path></svg></span><span id="btn-save-label" data-i18n="save">Save</span></button>
          <a class="btn btn--block" id="btn-open" target="_blank" rel="noopener" hidden data-i18n="viewOn">View on criterio.design</a>
        </div>
        <!-- Only with the tab: how to save one image or video, and bringing in what is saved elsewhere -->
        <div class="extras" id="extras">
          <p class="hint" data-i18n="rightClickHint">Right-click any image or video to save only that.</p>
          <div class="import-row">
            <span class="import-row__label" data-i18n="importLabel">Import</span>
            <button class="btn btn--small" id="btn-import-board" data-i18n="importBoardShort">A board</button>
            <button class="btn btn--small" id="btn-import-x" data-i18n="importXShort">Bookmarks on X</button>
            <button class="btn btn--small" id="btn-import-browser" data-i18n="importBrowserShort">Chrome bookmarks</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot" id="foot" hidden>
      <span class="foot__who" id="who"></span>
      <button class="link" id="btn-disconnect" data-i18n="disconnect">Disconnect</button>
    </footer>
  </main>
  <script src="boards.js"></script>
  <script src="popup.js"></script>
</body>
</html>
