<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>criterio.design</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app" class="app" data-view="loading">
    <header class="top">
      <span class="brand">criterio.design</span>
      <span class="top__meta" id="ws-name"></span>
    </header>

    <!-- Sin llave: conectar -->
    <section class="view" data-view="connect">
      <p class="lead">Guarda la web que estás viendo en tu librería.</p>
      <p class="hint" id="connect-msg"></p>
      <button class="btn btn--primary btn--block" id="btn-connect">Conectar con criterio.design</button>
      <details class="paste">
        <summary>Ya tengo una llave</summary>
        <input class="input" id="paste-key" placeholder="crit_…" spellcheck="false" autocomplete="off" />
        <input class="input" id="paste-base" placeholder="https://criterio.design" spellcheck="false" autocomplete="off" />
        <button class="btn btn--block" id="btn-paste">Usar esta llave</button>
      </details>
    </section>

    <!-- Con llave: pestaña actual -->
    <section class="view" data-view="tab">
      <div class="site">
        <img class="site__fav" id="tab-fav" alt="" hidden />
        <div class="site__text">
          <div class="site__title" id="tab-title"></div>
          <div class="site__host" id="tab-host"></div>
        </div>
      </div>
      <p class="hint" id="tab-msg"></p>
      <button class="btn btn--primary btn--block" id="btn-save">Guardar</button>
      <a class="btn btn--block" id="btn-open" target="_blank" rel="noopener" hidden>Ver en criterio.design</a>
    </section>

    <footer class="foot" id="foot" hidden>
      <span class="foot__who" id="who"></span>
      <button class="link" id="btn-disconnect">Desconectar</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
