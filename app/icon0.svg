<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg{fill:#161616}.line{stroke:rgba(255,255,255,.14)}.ink{fill:#f2f2f2}
    @media (prefers-color-scheme:light){.bg{fill:#f2f2f2}.line{stroke:rgba(0,0,0,.10)}.ink{fill:#0d0d0d}}
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <rect class="line" x=".5" y=".5" width="63" height="63" rx="13.5" fill="none"/>
  <g class="ink"><rect x="14" y="14" width="16" height="21" rx="3.5"/><rect x="14" y="39" width="16" height="11" rx="3.5"/><rect x="34" y="14" width="16" height="11" rx="3.5"/><rect x="34" y="29" width="16" height="21" rx="3.5"/></g>
</svg>
